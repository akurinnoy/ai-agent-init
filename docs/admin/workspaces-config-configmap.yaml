# The recommended AI agent config repo, for every workspace.
#
#   oc apply -n <che-namespace> -f workspaces-config-configmap.yaml
#
# che-operator copies objects that carry BOTH labels below from the Che namespace into every user namespace
# (it also adds the DevWorkspace automount labels to the copy). mount-as: env hands the two values to the
# workspace containers as environment variables, where ai-agent-init reads them.
#
# Edit the URL and ref. A developer's own repo (AI_CONFIG_REPO_URL in their Secret) replaces this default.
apiVersion: v1
kind: ConfigMap
metadata:
  name: ai-agent-config-default
  namespace: <che-namespace>
  labels:
    app.kubernetes.io/part-of: che.eclipse.org
    app.kubernetes.io/component: workspaces-config
  annotations:
    controller.devfile.io/mount-as: env
data:
  AI_CONFIG_DEFAULT_REPO_URL: https://github.com/<org>/<repo>.git
  AI_CONFIG_DEFAULT_REPO_REF: main
