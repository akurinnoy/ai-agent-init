# Merge patch for the CheCluster: adds the ai-agent-init init container to every workspace pod.
#
#   oc patch checluster <name> -n <che-namespace> --type merge --patch-file checluster-patch.yaml
#
# A merge patch REPLACES the whole initContainers list. Use it only when the list is empty or absent;
# otherwise append the entry with a JSON patch (see README.md).
#
# The image is pinned by digest (index of linux/amd64 and linux/arm64). To update, read the new digest from
# the registry, never from the build log.
spec:
  devEnvironments:
    initContainers:
      - name: ai-agent-init
        image: quay.io/okurinny/ai-agent-init@sha256:408566f2640043ff7a68db0546d2fe3b3a59b5d0594319106ba0ae34d620389e
        imagePullPolicy: IfNotPresent
        workingDir: /home/user
        volumeMounts:
          - name: persistent-home
            mountPath: /home/user/
